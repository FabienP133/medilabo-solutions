<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fiche patient</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1, h2 {
            margin-bottom: 20px;
        }

        .section {
            border: 1px solid #cccccc;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .risk-level {
            font-size: 20px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 140px;
        }

        button, a.button {
            display: inline-block;
            padding: 10px 14px;
            margin-top: 20px;
            background-color: #2d6cdf;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        a.back {
            display: inline-block;
            margin-top: 20px;
            color: #2d6cdf;
            text-decoration: none;
            font-weight: bold;
        }

        .note {
            border: 1px solid #dddddd;
            background-color: #f8f8f8;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h1>Fiche patient</h1>

<div class="section">
    <h2>Évaluation du risque diabète</h2>
    <p>
        <strong>Niveau de risque :</strong>
        <span class="risk-level" th:text="${assessmentResult.riskLevel}"></span>
    </p>
</div>

<div class="section">
    <h2>Informations personnelles</h2>

    <form th:action="@{/patients/{id}/update(id=${patient.id})}" th:object="${patient}" method="post">
        <label for="firstName">Prénom</label>
        <input id="firstName" type="text" th:field="*{firstName}" required>

        <label for="lastName">Nom</label>
        <input id="lastName" type="text" th:field="*{lastName}" required>

        <label for="birthDate">Date de naissance</label>
        <input id="birthDate" type="date" th:field="*{birthDate}" required>

        <label for="gender">Genre</label>
        <select id="gender" th:field="*{gender}" required>
            <option value="">-- Sélectionner --</option>
            <option value="M">M</option>
            <option value="F">F</option>
        </select>

        <label for="address">Adresse</label>
        <input id="address" type="text" th:field="*{address}">

        <label for="phone">Téléphone</label>
        <input id="phone" type="text" th:field="*{phone}">

        <button type="submit">Enregistrer les informations</button>
    </form>
</div>

<div class="section">
    <h2>Notes médicales</h2>

    <div th:if="${#lists.isEmpty(notes)}">
        <p>Aucune note médicale pour ce patient.</p>
    </div>

    <div th:each="note : ${notes}" class="note">
        <span th:text="${note.note}"></span>
    </div>
</div>

<div class="section">
    <h2>Ajouter une note</h2>

    <form th:action="@{/patients/{id}/notes(id=${patient.id})}" th:object="${newNote}" method="post">
        <label for="note">Note médicale</label>
        <textarea id="note" th:field="*{note}" required></textarea>

        <button type="submit">Ajouter la note</button>
    </form>
</div>

<a class="back" th:href="@{/patients}">Retour à la liste des patients</a>

</body>
</html>
